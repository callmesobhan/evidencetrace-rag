name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,pdf]"
      - run: ruff check src tests scripts
      - run: pytest
      - run: python scripts/verify_freeze.py
      - run: evidencetrace eval --corpus data/samples/papers --gold data/samples/gold --out reports

  llamaindex:
    # exercises the real LlamaIndex index/persist path with a mock embedding (no model downloads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" llama-index-core
      - run: pytest tests/test_adapters.py -rs
